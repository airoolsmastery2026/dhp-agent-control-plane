services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - agent-internal

  control-plane:
    build: .
    depends_on:
      - ollama
    env_file:
      - .env
    volumes:
      - ./runtime:/app/runtime
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - agent-internal

networks:
  agent-internal:
    internal: true

volumes:
  ollama-data:
